name: Alerta Diario de Chuva as 21h (BRT)

on:
  schedule:
    # 00:00 UTC = 21:00 Horário de Brasília (America/Sao_Paulo)
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite testar manualmente com 1 clique no GitHub

jobs:
  send-daily-rain-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install all project dependencies
        run: pip install -r requirements.txt

      - name: Disparar notificacao Push das 21h diretamente para o iPhone
        run: |
          python -c "from app import run_scheduled_notifications_check; res = run_scheduled_notifications_check(force_all=True); print('Resultado envio Push:', res)"

      - name: Acordar servidor Render em segundo plano
        run: |
          curl -s -m 90 "https://rain-check-pwa.onrender.com/api/vapid-public-key" || true
